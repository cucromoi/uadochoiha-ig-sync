name: daily-ig-sync

on:
  schedule:
    # 23:30 giờ VN = 16:30 UTC
    - cron: "30 16 * * *"
  workflow_dispatch:

concurrency:
  group: ig-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # Cố định bản Ubuntu: ubuntu-latest đang chuyển sang 26 và đường dẫn Chrome có thể đổi.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME_PATH: /usr/bin/google-chrome-stable
      UAD_PASSWORD: ${{ secrets.UAD_PASSWORD }}
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kiểm tra Chrome trên runner
        run: |
          "$CHROME_PATH" --version
          curl -s -o /dev/null -w 'instagram HTTP %{http_code}\n' https://www.instagram.com/uadochoiha/

      - name: Cài dependency
        run: npm ci --no-audit --no-fund

      - name: Chạy đồng bộ Instagram -> site
        shell: bash
        run: |
          mkdir -p data
          set -o pipefail
          node sync.js 2>&1 | tee data/sync.log

      - name: Lưu log phiên chạy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_number }}
          path: data/
          retention-days: 14
